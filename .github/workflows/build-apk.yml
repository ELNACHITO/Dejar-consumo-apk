name: Construir APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir app.zip (si se subio asi)
        run: if [ -f app.zip ]; then unzip -o app.zip; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MiRegistro.apk

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MiRegistro-apk
          path: MiRegistro.apk

      - name: Publicar en "Releases" para descargar desde el celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Mi Registro v1.0.${{ github.run_number }}
          files: MiRegistro.apk
